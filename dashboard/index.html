<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Proxy · Panel</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#dde1e6;--ac:#0a7d4f;--acx:#fff;--wa:#b45309;--er:#b42318;--ok:#0a7d4f;--in:#f0f2f5}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1d2125;--tx:#e8ebee;--mu:#9aa5b1;--bd:#2f353b;--ac:#2fb37a;--acx:#06210f;--wa:#f0a64a;--er:#f2766b;--ok:#2fb37a;--in:#262b30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
h1{font-size:1.35rem;margin:0}h2{font-size:1.1rem;margin:0 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.sub{color:var(--mu);font-size:.92rem;margin:0 0 12px}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ac);color:var(--acx);font-weight:700;font-size:.9rem;margin-right:8px}
button{font:inherit;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:8px;padding:8px 14px;cursor:pointer}
button.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.dan{color:var(--er)}button:disabled{opacity:.5;cursor:default}
button.sm{padding:4px 10px;font-size:.88rem}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:.85rem;color:var(--mu);margin:0 0 2px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.acc{border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0;background:var(--in)}
.acc .row{margin-bottom:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.badge{display:inline-block;border-radius:99px;padding:1px 10px;font-size:.82rem;font-weight:600;border:1px solid}
.b-ok{color:var(--ok);border-color:var(--ok)}.b-er{color:var(--er);border-color:var(--er)}.b-wa{color:var(--wa);border-color:var(--wa)}.b-mu{color:var(--mu);border-color:var(--bd)}
.banner{border-radius:12px;padding:14px 16px;border:2px solid var(--ac);background:var(--card)}
.banner.bad{border-color:var(--er)}
.banner b{display:block;margin-bottom:2px}
.msg{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.92rem}
.msg.er{background:rgba(180,35,24,.12);color:var(--er)}.msg.ok{background:rgba(10,125,79,.12);color:var(--ok)}.msg.wa{background:rgba(180,83,9,.12);color:var(--wa)}
pre{background:#0d1117;color:#d6dde6;border-radius:8px;padding:10px;max-height:260px;overflow:auto;font-size:.8rem;white-space:pre-wrap;word-break:break-all;margin:8px 0 0}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:.92rem;vertical-align:middle}
code,.mono{font-family:ui-monospace,Consolas,monospace}
.kv{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--bd)}
.kv:last-child{border:0}.kv .v{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:1.05rem}
.vps{border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0;background:var(--in)}
details{margin-top:8px}summary{cursor:pointer;color:var(--mu)}
a.btn{display:inline-block;background:var(--ac);color:var(--acx);padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:600}
.hide{display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 20px;border-radius:99px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
</style>
</head>
<body>
<main>
<header>
  <h1 id="title"></h1>
  <div class="bar" style="margin:0">
    <select id="lang" style="width:auto"><option value="es">Español</option><option value="en">English</option></select>
    <button id="quit" class="sm"></button>
  </div>
</header>

<div id="warn"></div>
<div id="banner"></div>

<section class="card" id="s1"></section>
<section class="card" id="s2"></section>
<section class="card" id="s3"></section>
<section class="card" id="s4"></section>

<div id="toast" role="status"></div>
<section class="card hide" id="logcard">
  <h2 id="logtitle"></h2>
  <div id="tsbox"></div>
  <pre id="log"></pre>
</section>
</main>

err:"Error"

let lang = localStorage.getItem("lang") || ((navigator.language||"es").slice(0,2) === "en" ? "en" : "es");
const t = k => (I18N[lang] && I18N[lang][k]) || I18N.es[k] || k;

const q = new URLSearchParams(location.search);
if (q.get("t")) { sessionStorage.setItem("tok", q.get("t")); history.replaceState(null, "", location.pathname); }
const TOK = sessionStorage.getItem("tok") || "";

let S = {accounts: [], vps: [], tools: {}, ssh_key: false};
let draft = [];            // cuentas en edición
let verified = null;       // último resultado de "Probar"
let status = {};           // alias -> estado de la VPS
let statusLoading = {};
let dirty = false;
let logJob = null;

// ---------- utilidades DOM
// replaceChildren nativo no aplana arreglos; lo envolvemos para poder pasar listas.
const _rc = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...kids) { _rc.apply(this, kids.flat(Infinity).filter(k => k != null && k !== false && k !== "")); };
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const $ = id => document.getElementById(id);
function badge(text, kind) { return h("span", {class: "badge b-" + kind}, text); }
function toast(text) { const e = $("toast"); e.textContent = text; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2200); }
function msg(box, text, kind) { box.replaceChildren(text ? h("div", {class: "msg " + kind}, text) : ""); }
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const ta = h("textarea", {style: "position:fixed;opacity:0"}); ta.value = text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  const old = btn.textContent; btn.textContent = t("copied"); setTimeout(() => btn.textContent = old, 1200);
}

async function api(path, body) {
  let r;
  try {
    r = await fetch(path, {method: body === undefined ? "GET" : "POST", headers: {"X-Token": TOK, "Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  } catch (e) { $("warn").replaceChildren(h("div", {class: "msg er"}, t("w_conn"))); throw e; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || (t("err") + " " + r.status));
  return j;
}

async function runJob(path, body, title) {
  const {job} = await api(path, body);
  logJob = job;
  const quiet = path === "/api/verify";
  if (!quiet) {
    $("logcard").classList.remove("hide"); $("logtitle").textContent = title + " — " + t("job_running");
    $("log").textContent = ""; $("tsbox").replaceChildren();
    $("logcard").scrollIntoView({behavior: "smooth", block: "nearest"});
  }
  let since = 0;
  for (;;) {
    await new Promise(r => setTimeout(r, 1000));
    const j = await api("/api/jobs/" + job + "?since=" + since);
    since = j.next;
    if (j.lines.length && !quiet) {
      const pre = $("log"); pre.textContent += j.lines.join("\n") + "\n"; pre.scrollTop = pre.scrollHeight;
      const m = pre.textContent.match(/https:\/\/login\.tailscale\.com\/a\/\w+/);
      if (m && j.status === "running" && !$("tsbox").firstChild)
        $("tsbox").replaceChildren(h("div", {class: "msg wa"}, h("b", {}, t("ts_auth")), h("div", {}, t("ts_help")), h("div", {class: "bar"}, h("a", {class: "btn", href: m[0], target: "_blank", rel: "noopener noreferrer"}, t("ts_open")))));
    }
    if (j.status !== "running") {
      if (quiet) return j;
      $("logtitle").textContent = title + " — " + (j.status === "ok" ? t("job_ok") : t("job_fail"));
      $("tsbox").replaceChildren();
      return j;
    }
  }
}

// ---------- render
function render() {
  document.documentElement.lang = lang;
  $("title").textContent = t("title"); $("quit").textContent = t("quit"); $("lang").value = lang;
  const miss = Object.entries(S.tools || {}).filter(([, v]) => !v).map(([k]) => k);
  $("warn").replaceChildren(miss.length ? h("div", {class: "msg er"}, t("w_tools") + miss.join(", ")) : "");
  renderBanner(); renderS1(); renderS2(); renderS3(); renderS4();
}

const accOk = a => a.exit_ip && a.targets.every(x => x.ok) && !a.partial && !a.inconsistent_ip;
function verifiedOk(r) { return !!r && r.accounts.every(accOk) && !r.duplicate_ips; }
function renderBanner() {
  let k = null;
  if (!S.accounts.length) k = "nx_acc";
  else if (!verified) k = "nx_test";
  else if (!verifiedOk(verified)) k = "nx_fix";
  else if (!S.vps.length) k = "nx_vps";
  else {
    const sts = S.vps.map(v => status[v.alias]);
    if (sts.some(s => !s)) k = "nx_wait";
    else if (sts.every(s => !s.prepared)) k = "nx_prep";
    else if (sts.some(s => s.prepared && !s.accounts.length)) k = "nx_dep";
    else k = "nx_done";
  }
  const done = k === "nx_done";
  $("banner").replaceChildren(h("div", {class: "banner" + (k === "nx_fix" ? " bad" : "")}, h("b", {}, (done ? "✅ " : k === "nx_fix" ? "⚠️ " : "👉 ") + t(k)), k === "nx_wait" ? "" : t(k + "_d")));
}

function renderS1() {
  const box = h("div");
  const out = h("div");
  if (!draft.length) box.append(h("p", {class: "sub"}, t("no_accounts")));
  draft.forEach((a, i) => {
    const inp = (key, label, type, ph, extra) => h("div", {}, h("label", {}, label),
      h("input", Object.assign({type: type || "text", value: a[key] ?? "", placeholder: ph || "", autocomplete: "off", spellcheck: "false", oninput: e => { a[key] = e.target.value; dirty = true; }}, extra || {})));
    box.append(h("div", {class: "acc"},
      h("b", {}, t("acc") + " " + (a.n || "") ),
      h("div", {class: "row"}, inp("label", t("name"), "text", t("name_ph")), inp("host", t("server"), "text", "isp.ejemplo.com"), inp("port", t("port"), "number", "10001", {min: 1, max: 65535})),
      h("div", {class: "row"}, inp("user", t("user")), inp("password", t("pass"), "password", a.has_password ? t("pass_keep") : "", {autocomplete: "new-password"})),
      h("button", {class: "sm dan", onclick: () => { if (confirm(t("confirm_rm"))) { draft.splice(i, 1); dirty = true; renderS1(); } }}, t("remove"))));
  });
  const pasteIn = h("input", {type: "text", placeholder: t("paste_ph"), autocomplete: "off", spellcheck: "false"});
  const pasteMsg = h("div");
  const addBtn = h("button", {onclick: () => { draft.push({n: null, label: "", host: "", port: "", user: "", password: "", has_password: false}); dirty = true; renderS1(); }}, t("add"));
  const fill = () => {
    try {
      const u = new URL(pasteIn.value.trim());
      if (!/^socks5h?:$/.test(u.protocol) || !u.hostname) throw 0;
      draft.push({n: null, label: "", host: u.hostname, port: u.port, user: decodeURIComponent(u.username), password: decodeURIComponent(u.password), has_password: false});
      dirty = true; renderS1();
    } catch (e) { msg(pasteMsg, t("paste_bad"), "er"); }
  };
  const saveBtn = h("button", {class: "pri"}, t("save")), testBtn = h("button", {}, t("test"));
  const note = h("div");
  saveBtn.onclick = async () => { try { await save(); toast("✓ " + t("saved")); } catch (e) { msg(note, e.message, "er"); } };
  testBtn.onclick = async () => {
    try {
      if (dirty) await save();
      testBtn.disabled = true; testBtn.textContent = t("testing"); msg(note, "", "");
      const j = await runJob("/api/verify", {}, t("test"));
      verified = j.result || null; renderBanner(); renderResults(out, j.result);
    } catch (e) { msg(note, e.message, "er"); }
    testBtn.disabled = false; testBtn.textContent = t("test");
  };
  box.append(h("div", {class: "bar"}, addBtn, h("details", {style: "margin:0"}, h("summary", {}, t("paste")), h("div", {class: "bar"}, pasteIn, h("button", {onclick: fill}, t("paste_btn"))), pasteMsg)),
    h("div", {class: "bar"}, saveBtn, testBtn, h("span", {class: "sub", style: "margin:0"}, t("test_note"))), note, out);
  $("s1").replaceChildren(h("h2", {}, h("span", {class: "num"}, "1"), t("s1")), h("p", {class: "sub"}, t("s1d")), box);
  if (verified) renderResults(out, verified);
}

function renderResults(box, r) {
  if (!r) return box.replaceChildren();
  const rows = r.accounts.map(a => {
    const okAll = accOk(a);
    const nOk = (a.gateways || []).filter(g => g.ok).length;
    const gw = a.gateways && a.gateways.length ? h("div", {class: "msg " + (a.partial ? "er" : "wa"), style: "margin-top:4px"},
      a.partial ? t("partial").replace("{ok}", nOk).replace("{n}", a.gateways.length) : (a.inconsistent_ip ? t("inconsistent") : ""),
      h("div", {class: "mono", style: "font-size:.8rem;margin-top:4px"}, a.gateways.map(g => h("div", {}, (g.ok ? "✅ " : "❌ ") + g.gateway + (g.exit_ip ? " → " + g.exit_ip : ""))))) : "";
    return h("tr", {}, h("td", {}, t("acc") + " " + a.n + (a.label ? " · " + a.label : "")),
      h("td", {class: "mono"}, a.exit_ip || "—"),
      h("td", {}, a.targets.map(x => h("span", {style: "margin-right:6px"}, x.ok ? "✅" : "❌", " ", h("small", {}, x.target))), a.error && !okAll && !a.partial ? h("div", {class: "sub", style: "margin:2px 0 0"}, a.error) : "", gw),
      h("td", {}, okAll ? badge("OK", "ok") : badge("✗", "er")));
  });
  const allOk = verifiedOk(r), anyBad = r.accounts.some(a => !accOk(a));
  box.replaceChildren(h("table", {}, h("tr", {}, h("th", {}, t("acc")), h("th", {}, t("res_ip")), h("th", {}, "WhatsApp"), h("th", {})), rows),
    r.duplicate_ips ? h("div", {class: "msg er"}, t("dup")) : "", allOk || anyBad ? h("div", {class: "msg " + (allOk ? "ok" : "er")}, allOk ? t("test_all_ok") : t("test_some_bad")) : "");
}

async function save() {
  const r = await api("/api/accounts", {accounts: draft.map(a => ({n: a.n, label: a.label, host: a.host, port: a.port, user: a.user, password: a.password || ""}))});
  S.accounts = r.accounts; draft = S.accounts.map(a => ({...a, password: ""})); dirty = false; verified = null; render();
}

function renderS2() {
  const ipIn = h("input", {type: "text", placeholder: "203.0.113.10", autocomplete: "off"}), nmIn = h("input", {type: "text", placeholder: "vps1", autocomplete: "off"});
  const note = h("div");
  const add = h("button", {class: "pri", onclick: async () => {
    try { const r = await api("/api/vps", {ip: ipIn.value.trim(), alias: nmIn.value.trim()}); S.vps = r.vps; render(); refreshAll(); } catch (e) { msg(note, e.message, "er"); }
  }}, t("vps_add"));
  const list = S.vps.length ? S.vps.map(vpsCard) : [h("p", {class: "sub"}, t("vps_none"))];
  const keyOut = h("div");
  const keyBtn = h("button", {class: "sm", onclick: async () => {
    const r = await api("/api/ssh-key", {}); S.ssh_key = true;
    const ta = h("textarea", {readonly: true, rows: 3, style: "width:100%;font:12px ui-monospace,monospace"}); ta.value = r.public_key;
    keyOut.replaceChildren(ta, h("button", {class: "sm", onclick: e => copy(r.public_key, e.target)}, t("copy")));
  }}, t("key_show"));
  $("s2").replaceChildren(h("h2", {}, h("span", {class: "num"}, "2"), t("s2")), h("p", {class: "sub"}, t("s2d")), list,
    h("div", {class: "row", style: "margin-top:10px"}, h("div", {}, h("label", {}, t("vps_ip")), ipIn), h("div", {}, h("label", {}, t("vps_name")), nmIn), add), note,
    h("details", {}, h("summary", {}, t("key_title")), h("p", {class: "sub"}, t("key_help")), keyBtn, keyOut));
}

function vpsCard(v) {
  const st = status[v.alias];
  const userIn = h("input", {type: "text", value: "root", autocomplete: "off"});
  const passIn = h("input", {type: "password", autocomplete: "new-password", placeholder: "••••••"});
  const prepBtn = h("button", {class: "pri"}, t("prep_go"));
  const depBtn = h("button", {class: "pri"}, t("deploy"));
  const note = h("div");
  const guard = async (btn, title, path, body) => {
    btn.disabled = true; msg(note, "", "");
    try { const j = await runJob(path, body, title); await refresh(v.alias); return j; }
    catch (e) { msg(note, e.message, "er"); } finally { btn.disabled = false; }
  };
  prepBtn.onclick = () => guard(prepBtn, t("prep") + " · " + v.ip, "/api/prepare", {alias: v.alias, initial_user: userIn.value.trim(), password: passIn.value}).then(() => { passIn.value = ""; });
  depBtn.onclick = async () => { if (dirty) { try { await save(); } catch (e) { return msg(note, e.message, "er"); } } guard(depBtn, t("deploy") + " · " + v.ip, "/api/deploy", {alias: v.alias}); };
  const state = !st ? badge(t("loading"), "mu") : !st.reachable ? badge(t("no_conn"), "er") : !st.prepared ? badge(t("no_prep"), "wa") : st.accounts.length ? badge(t("st_up"), "ok") : badge(t("not_deployed"), "wa");
  return h("div", {class: "vps"},
    h("div", {class: "kv"}, h("span", {}, h("b", {}, v.alias), " · ", h("span", {class: "mono"}, v.ip)), h("span", {}, state, " ", h("button", {class: "sm dan", onclick: async () => { if (confirm(t("confirm_del"))) { S.vps = (await api("/api/vps/delete", {alias: v.alias})).vps; delete status[v.alias]; render(); } }}, t("vps_del")))),
    st && st.message ? h("div", {class: "msg wa"}, st.message) : "",
    h("details", {open: !!st && (!st.reachable || !st.prepared)}, h("summary", {}, t("prep")), h("p", {class: "sub"}, t("prep_help")),
      h("div", {class: "row"}, h("div", {}, h("label", {}, t("prep_user")), userIn), h("div", {}, h("label", {}, t("prep_pass")), passIn), prepBtn),
      h("p", {class: "sub"}, t("prep_pass_h"))),
    h("div", {class: "bar"}, depBtn, h("span", {class: "sub", style: "margin:0"}, t("deploy_help"))), note);
}

function renderS3() {
  const body = S.vps.length ? S.vps.map(v => {
    const st = status[v.alias];
    const rf = h("button", {class: "sm", onclick: () => refresh(v.alias)}, t("refresh"));
    let inner;
    if (statusLoading[v.alias] || !st) inner = h("p", {class: "sub"}, t("loading"));
    else if (!st.accounts.length) inner = h("p", {class: "sub"}, st.message || t("not_deployed"));
    else inner = h("table", {}, st.accounts.map(a => {
      const label = (S.accounts.find(x => x.n === a.n) || {}).label;
      const up = a.state === "running";
      const pw = action => h("button", {class: "sm", onclick: async e => { e.target.disabled = true; try { await api("/api/power", {alias: v.alias, n: a.n, action}); } catch (er) { alert(er.message); } refresh(v.alias); }}, t(action));
      return h("tr", {}, h("td", {}, t("acc") + " " + a.n + (label ? " · " + label : "")),
        h("td", {}, up ? badge(t("st_up"), "ok") : a.state === "exited" ? badge(t("st_down"), "mu") : badge(t("st_other") + ": " + a.state, "wa")),
        h("td", {class: "mono"}, a.exit_ip || "—"), h("td", {}, up ? [pw("restart"), " ", pw("stop")] : pw("start")));
    }));
    return h("div", {class: "vps"}, h("div", {class: "kv"}, h("span", {}, h("b", {}, v.alias), " · ", h("span", {class: "mono"}, v.ip), st && st.tailscale_ip ? [" · Tailscale ", h("span", {class: "mono"}, st.tailscale_ip)] : ""), rf), inner);
  }) : h("p", {class: "sub"}, t("vps_none"));
  $("s3").replaceChildren(h("h2", {}, h("span", {class: "num"}, "3"), t("s3")), h("p", {class: "sub"}, t("s3d")), body);
}

function renderS4() {
  const cards = [];
  S.vps.forEach(v => {
    const st = status[v.alias];
    if (!st || !st.tailscale_ip || !st.accounts.length) return;
    st.accounts.forEach(a => {
      const label = (S.accounts.find(x => x.n === a.n) || {}).label;
      const kv = (k, val, cp) => h("div", {class: "kv"}, h("span", {}, k), h("span", {class: "v"}, val), cp ? h("button", {class: "sm", onclick: e => copy(String(val), e.target)}, t("copy")) : h("span"));
      cards.push(h("div", {class: "vps"}, h("b", {}, t("acc") + " " + a.n + (label ? " · " + label : "") + (S.vps.length > 1 ? "  (" + v.alias + ")" : "")),
        kv(t("f_addr"), st.tailscale_ip, true), kv(t("f_chat"), 5100 + a.n, true), kv(t("f_media"), 5200 + a.n, true), kv(t("f_tls"), t("tls_off"), false)));
    });
  });
  $("s4").replaceChildren(h("h2", {}, h("span", {class: "num"}, "4"), t("s4")), h("p", {class: "sub"}, t("s4d")),
    cards.length ? cards : h("p", {class: "sub"}, t("s4_none")), h("div", {class: "msg wa"}, t("s4_warn")));
}

async function refresh(alias) {
  statusLoading[alias] = true; renderS3();
  try { status[alias] = await api("/api/status", {alias}); }
  catch (e) { status[alias] = {alias, reachable: false, prepared: false, accounts: [], message: e.message}; }
  statusLoading[alias] = false; renderBanner(); renderS2(); renderS3(); renderS4();
}
function refreshAll() { S.vps.forEach(v => refresh(v.alias)); }

$("lang").onchange = e => { lang = e.target.value; localStorage.setItem("lang", lang); render(); };
$("quit").onclick = async () => { if (!confirm(t("confirm_quit"))) return; try { await api("/api/quit", {}); } catch (e) {} document.body.replaceChildren(h("main", {}, h("p", {}, t("closed")))); };

(async function init() {
  try { S = await api("/api/state"); } catch (e) { return; }
  draft = S.accounts.map(a => ({...a, password: ""}));
  render(); refreshAll();
})();
</script>
